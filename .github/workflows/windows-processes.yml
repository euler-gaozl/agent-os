name: Windows process recovery
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/windows-processes.yml']
  pull_request:
    paths: ['scripts/**', '.github/workflows/windows-processes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  process-recovery:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare the supported D workspace layout
        shell: pwsh
        run: |
          $target = 'D:\workspace\agent-platform\repos\agent-os'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
          git clone --no-hardlinks -- $env:GITHUB_WORKSPACE $target
          if ($LASTEXITCODE) { throw 'Cannot prepare the Windows platform checkout.' }
      - name: Real Windows launch, orphan cleanup and interrupted maintenance
        shell: pwsh
        working-directory: D:/workspace/agent-platform/repos/agent-os
        run: ./scripts/Test-WindowsProcesses.ps1 -NodeBinary (Get-Command node).Source -GoBinary (Get-Command go).Source
      - name: Independent service update, rollback and interrupted release recovery
        shell: pwsh
        working-directory: D:/workspace/agent-platform/repos/agent-os
        run: ./scripts/Test-WindowsReleases.ps1 -GoBinary (Get-Command go).Source
      - name: Fixed owner source selection and refusal boundaries
        shell: pwsh
        working-directory: D:/workspace/agent-platform/repos/agent-os
        run: ./scripts/Test-ServiceSources.ps1
      - name: Retain synthetic evidence including failed cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-process-recovery
          path: |
            D:/workspace/agent-platform/local/evidence/windows-processes-*
            D:/workspace/agent-platform/local/evidence/windows-releases-*
            D:/workspace/agent-platform/local/evidence/service-sources-*
          if-no-files-found: error
