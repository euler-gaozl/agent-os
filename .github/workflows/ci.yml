name: Platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: agentos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://agentos:integration-test-only@127.0.0.1:5432/agentos?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: harness
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: web
